<!DOCTYPE html>
<html>

<head>
    <title>Teacher Login</title>
</head>

<body style="font-family:Arial;background:#eef5ff;">

    <div
        style="width:350px;margin:80px auto;background:white;padding:25px;border-radius:12px;text-align:center;box-shadow:0 0 10px #ccc;">

        <h2 style="color:#0056b3;">Teacher Login</h2>

        {% with messages = get_flashed_messages(with_categories=true) %}
        {% for category,message in messages %}
        <p style="color:red;">{{message}}</p>
        {% endfor %}
        {% endwith %}

        <form method="POST">

            <input type="text" name="username" placeholder="Username" required
                style="width:90%;padding:10px;margin:10px;"><br>

            <input type="password" name="password" placeholder="Password" required
                style="width:90%;padding:10px;margin:10px;"><br>

            <button type="submit"
                style="width:95%;padding:10px;background:#007bff;color:white;border:none;border-radius:6px;">
                Login
            </button>

        </form>

    </div>

</body>

</html>
