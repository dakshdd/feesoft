<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create User | Feesoft</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #eaf0ff, #f4f6f9);
            margin: 0;
            padding: 40px 15px;
        }

        h2 {
            text-align: center;
            color: #243b55;
            margin-bottom: 22px;
        }

        form {
            max-width: 430px;
            margin: auto;
            padding: 28px;
            background: white;
            border-radius: 14px;
            box-shadow: 0 8px 30px rgba(0, 0, 0, .09);
        }

        label {
            display: block;
            font-weight: bold;
            color: #34495e;
            margin-top: 12px;
        }

        input,
        select,
        button {
            width: 100%;
            padding: 12px;
            margin: 8px 0 12px;
            border: 1px solid #d5dce5;
            border-radius: 7px;
            font-size: 15px;
        }

        select:focus,
        input:focus {
            outline: none;
            border-color: #3498db;
        }

        button {
            background: #243b55;
            color: white;
            border: none;
            font-weight: bold;
            cursor: pointer;
            margin-top: 20px;
        }

        button:hover {
            background: #1abc9c;
        }

        .hidden {
            display: none;
        }

        .msg {
            max-width: 430px;
            margin: 10px auto;
            text-align: center;
            font-weight: bold;
            padding: 10px;
            border-radius: 7px;
        }

        .error {
            color: #c0392b;
            background: #fdecea;
        }

        .success {
            color: #218838;
            background: #eafaf1;
        }

        .info {
            font-size: 12px;
            color: #777;
            margin-top: -5px;
        }
    </style>
</head>

<body>

    <h2>CREATE NEW USER</h2>

    {% if error %}
    <div class="msg error">{{ error }}</div>
    {% endif %}

    {% if success %}
    <div class="msg success">{{ success }}</div>
    {% endif %}

    <form method="POST" autocomplete="off">

        <label>Username</label>
        <input type="text" name="username" placeholder="Enter username" required>

        <label>Password</label>
        <input type="password" name="password" placeholder="Enter password" required>

        <label>User Role</label>
        <select name="role" id="role" onchange="toggleFields()" required>
            <option value="admin">Admin</option>
            <option value="teacher">Teacher</option>
            <option value="parent">Parent</option>
            <option value="clerk">Clerk</option>
        </select>

        <!-- TEACHER -->
        <div id="teacherFields" class="hidden">

            <label>Select Class</label>

            <select name="class_id" id="class_id">
                <option value="">-- Select Class --</option>

                {% for c in classes %}
                <option value="{{ c }}">{{ c }}</option>
                {% endfor %}

            </select>

            <div class="info">
                Classes loaded: {{ classes|length }}
            </div>

            <label>Select Section</label>

            <select name="sec_id" id="sec_id">
                <option value="">-- Select Section --</option>
                <option value="A">A</option>
                <option value="B">B</option>
                <option value="C">C</option>
            </select>

        </div>

        <!-- PARENT -->
        <div id="parentFields" class="hidden">

            <label>Admission Code</label>

            <input type="text" name="adm_code" id="adm_code" placeholder="Example: ADM-0001">

        </div>

        <button type="submit">CREATE USER</button>

    </form>

    <script>

        function toggleFields() {

            const role = document.getElementById("role").value;

            const teacherFields = document.getElementById("teacherFields");
            const parentFields = document.getElementById("parentFields");

            const classField = document.getElementById("class_id");
            const sectionField = document.getElementById("sec_id");
            const admField = document.getElementById("adm_code");

            teacherFields.classList.toggle("hidden", role !== "teacher");
            parentFields.classList.toggle("hidden", role !== "parent");

            classField.required = role === "teacher";
            sectionField.required = role === "teacher";
            admField.required = role === "parent";
        }

        document.addEventListener("DOMContentLoaded", function () {
            toggleFields();
        });

    </script>

</body>

</html>
