<!DOCTYPE html>
<html>

<head>
    <title>Create User</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 40px;
        }

        form {
            max-width: 400px;
            margin: auto;
            padding: 20px;
            border: 1px solid #ccc;
            border-radius: 8px;
        }

        input,
        select,
        button {
            width: 100%;
            padding: 10px;
            margin: 8px 0;
        }

        button {
            background: #2c3e50;
            color: white;
            border: none;
            cursor: pointer;
        }

        button:hover {
            background: #1abc9c;
        }

        .msg {
            text-align: center;
            font-weight: bold;
            margin-bottom: 15px;
        }

        .error {
            color: red;
        }

        .success {
            color: green;
        }
    </style>
</head>

<body>
    <h2>Create New User</h2>
    {% if error %}
    <div class="msg error">{{ error }}</div>
    {% endif %}
    {% if success %}
    <div class="msg success">{{ success }}</div>
    {% endif %}
    <form method="POST">
        <label>Username:</label>
        <input type="text" name="username" required>

        <label>Password:</label>
        <input type="password" name="password" required>

        <label>Role:</label>
        <select name="role" required>
            <option value="admin">Admin</option>
            <option value="teacher">Teacher</option>
            <option value="parent">Parent</option>
            <option value="clerk">Clerk</option>
        </select>

        <label>Class ID (for Teacher):</label>
        <input type="text" name="class_id">

        <label>Admission Code (for Parent):</label>
        <input type="text" name="adm_code">

        <button type="submit">Create User</button>
    </form>
</body>

</html>
