<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Attendance</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="bg-light p-3">

    <div class="container-fluid">

        <div class="card shadow-sm">
            <div class="card-header bg-primary text-white">
                <h5 class="mb-0">📊 Attendance</h5>
            </div>

            <div class="card-body">

                <!-- FILTERS -->
                <div class="row g-2 mb-3">

                    <div class="col-md-3">
                        <label class="form-label">Date</label>
                        <input type="date" id="date" class="form-control" value="{{ today }}">
                    </div>

                    <div class="col-md-3">
                        <label class="form-label">Class</label>
                        <select id="class" class="form-select">
                            <option value="">Select Class</option>
                            {% for c in classes %}
                            <option value="{{ c }}">{{ c }}</option>
                            {% endfor %}
                        </select>
                    </div>

                    <div class="col-md-3">
                        <label class="form-label">Section</label>
                        <select id="section" class="form-select">
                            <option value="">Select Section</option>
                            {% for s in sections %}
                            <option value="{{ s }}">{{ s }}</option>
                            {% endfor %}
                        </select>
                    </div>

                    <div class="col-md-3 d-flex align-items-end">
                        <button class="btn btn-primary w-100" onclick="loadAttendance()">
                            🔍 View Attendance
                        </button>
                    </div>

                </div>

                <div id="message"></div>

                <!-- TABLE -->
                <div class="table-responsive">
                    <table class="table table-bordered table-hover text-center" id="attendanceTable">

                        <thead class="table-dark">
                            <tr>
                                <th>#</th>
                                <th>Admission No.</th>
                                <th>Student Name</th>
                                <th>Status</th>
                            </tr>
                        </thead>

                        <tbody id="attendanceBody">
                            <tr>
                                <td colspan="4" class="text-muted">
                                    Select Date, Class and Section
                                </td>
                            </tr>
                        </tbody>

                    </table>
                </div>

            </div>
        </div>

    </div>

    <script>
        async function loadAttendance() {

            const date = document.getElementById("date").value;
            const cls = document.getElementById("class").value;
            const section = document.getElementById("section").value;

            if (!date || !cls || !section) {
                alert("Please select Date, Class and Section");
                return;
            }

            const body = document.getElementById("attendanceBody");

            body.innerHTML = `
        <tr>
            <td colspan="4">Loading...</td>
        </tr>
    `;

            try {

                const response = await fetch(
                    `/attendance_view_data?date=${encodeURIComponent(date)}&class=${encodeURIComponent(cls)}&section=${encodeURIComponent(section)}`
                );

                const students = await response.json();

                if (!students.length) {
                    body.innerHTML = `
                <tr>
                    <td colspan="4" class="text-danger">
                        No attendance found for this date.
                    </td>
                </tr>
            `;
                    return;
                }

                body.innerHTML = "";

                students.forEach((stu, index) => {

                    let badge = "secondary";

                    if (stu.status === "Present") badge = "success";
                    if (stu.status === "Absent") badge = "danger";
                    if (stu.status === "Leave") badge = "warning";
                    if (stu.status === "Holiday") badge = "info";

                    body.innerHTML += `
                <tr>
                    <td>${index + 1}</td>
                    <td>${stu.adm_code}</td>
                    <td>${stu.student_name}</td>
                    <td>
                        <span class="badge bg-${badge}">
                            ${stu.status}
                        </span>
                    </td>
                </tr>
            `;
                });

            } catch (error) {

                console.error(error);

                body.innerHTML = `
            <tr>
                <td colspan="4" class="text-danger">
                    Error loading attendance
                </td>
            </tr>
        `;
            }
        }
    </script>

</body>

</html>
