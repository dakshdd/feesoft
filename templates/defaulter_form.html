<!DOCTYPE html>
<html>

<head>
    <title>Defaulter Report</title>
    <style>
        body {
            font-family: 'Segoe UI', sans-serif;
            background: linear-gradient(135deg, #6a11cb, #2575fc);
            margin: 0;
            padding: 0;
            color: #333;
        }

        .container {
            max-width: 500px;
            margin: 60px auto;
            background: #fff;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 6px 20px rgba(0, 0, 0, 0.15);
        }

        h2 {
            text-align: center;
            margin-bottom: 25px;
            color: #444;
        }

        label {
            font-weight: bold;
            margin-top: 10px;
            display: block;
        }

        select {
            width: 100%;
            padding: 10px;
            margin-top: 5px;
            border-radius: 8px;
            border: 1px solid #ccc;
            font-size: 14px;
        }

        button {
            width: 100%;
            padding: 12px;
            margin-top: 20px;
            background: #2575fc;
            color: #fff;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            cursor: pointer;
            transition: 0.3s;
        }

        button:hover {
            background: #6a11cb;
        }
    </style>
</head>

<body>
    <div class="container">
        <h2>Generate Defaulter Report</h2>
        <form method="POST">
            <label>Class:</label>
            <select name="class">
                <option value="">-- All Classes --</option>
                {% for c in classes %}
                <option value="{{ c }}">{{ c }}</option>
                {% endfor %}
            </select>

            <label>Section:</label>
            <select name="section">
                <option value="">-- All Sections --</option>
                {% for s in sections %}
                <option value="{{ s }}">{{ s }}</option>
                {% endfor %}
            </select>

            <label>Month:</label>
            <select name="month" required>
                <option>April</option>
                <option>May</option>
                <option>June</option>
                <option>July</option>
                <option>August</option>
                <option>September</option>
                <option>October</option>
                <option>November</option>
                <option>December</option>
                <option>January</option>
                <option>February</option>
                <option>March</option>
            </select>

            <button type="submit">Generate Report</button>
        </form>
    </div>
</body>

</html>
