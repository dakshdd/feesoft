<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <title>Parent Login</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f0f2f5;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
    }

    .login-card {
      background: #fff;
      padding: 30px;
      border-radius: 10px;
      box-shadow: 0 4px 8px rgba(0, 0, 0, 0.2);
      width: 350px;
    }

    h2 {
      text-align: center;
      margin-bottom: 20px;
      color: #333;
    }

    label {
      display: block;
      margin-top: 10px;
      font-weight: bold;
    }

    input {
      width: 100%;
      padding: 10px;
      margin-top: 5px;
      border: 1px solid #ccc;
      border-radius: 5px;
    }

    button {
      width: 100%;
      padding: 10px;
      margin-top: 20px;
      background: #007bff;
      color: #fff;
      border: none;
      border-radius: 5px;
      cursor: pointer;
      font-size: 16px;
    }

    button:hover {
      background: #0056b3;
    }

    .error {
      background: #fecaca;
      padding: 10px;
      margin-top: 10px;
      border-radius: 5px;
      text-align: center;
    }
  </style>
</head>

<body>
  <div class="login-card">
    <h2>Parent Login</h2>
    {% with messages = get_flashed_messages(with_categories=true) %}
    {% for category, msg in messages %}
    <div class="error">{{ msg }}</div>
    {% endfor %}
    {% endwith %}
    <form method="post">
      <label>Admission Code</label>
      <input type="text" name="adm_code" required>
      <label>Password</label>
      <input type="password" name="password" required>
      <button type="submit">Login</button>
    </form>
  </div>
</body>

</html>
