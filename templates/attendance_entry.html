<!DOCTYPE html>
<html>

<head>
    <title>Student Attendance Entry</title>

    <meta name="viewport" content="width=device-width, initial-scale=1">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body {
            background: #f4f7fb;
        }

        .top-box {
            background: linear-gradient(90deg, #0d6efd, #198754);
            color: white;
            padding: 18px;
            border-radius: 12px;
            margin-bottom: 20px;
        }

        .student-card {
            background: white;
            border-radius: 12px;
            padding: 12px;
            margin-bottom: 10px;
            box-shadow: 0 2px 6px rgba(0, 0, 0, .1);
        }

        .student-img {
            width: 55px;
            height: 55px;
            border-radius: 50%;
            object-fit: cover;
            border: 2px solid #0d6efd;
        }

        .status-btn {
            margin-right: 6px;
        }

        .save-btn {
            width: 100%;
            font-size: 18px;
            border-radius: 10px;
        }

        .teacher-info {
            background: #e8f4ff;
            border: 1px solid #b6dcff;
            padding: 10px 15px;
            border-radius: 8px;
            margin-bottom: 15px;
        }
    </style>

</head>

<body>

    <div class="container mt-4">

        <div class="top-box">
            <h3>📚 Student Attendance Entry</h3>
            <small>Mark daily attendance class-wise.</small>
        </div>

        {% if teacher %}

        <div class="teacher-info">
            👩‍🏫 <b>Teacher:</b> {{ session.get("teacher_name","Teacher") }}
            &nbsp;&nbsp; | &nbsp;&nbsp;
            📚 <b>Class:</b> {{ teacher_class }}
            &nbsp;&nbsp; | &nbsp;&nbsp;
            🏫 <b>Section:</b> {{ teacher_section }}
        </div>

        {% endif %}

        <div class="row g-3">

            <div class="col-md-4">
                <label>Class</label>

                <select class="form-select" id="class" {% if teacher %}disabled{% endif %}>

                    <option value="">Select Class</option>

                    {% for c in classes %}
                    <option value="{{ c }}" {% if teacher and c==teacher_class %}selected{% endif %}>
                        {{ c }}
                    </option>
                    {% endfor %}

                </select>

            </div>


            <div class="col-md-3">
                <label>Section</label>

                <select class="form-select" id="section" {% if teacher %}disabled{% endif %}>

                    <option value="">Select Section</option>

                    {% for s in sections %}
                    <option value="{{ s }}" {% if teacher and s==teacher_section %}selected{% endif %}>
                        {{ s }}
                    </option>
                    {% endfor %}

                </select>

            </div>


            <div class="col-md-3">
                <label>Date</label>

                <input type="date" id="date" class="form-control" value="{{ today }}">

            </div>


            <div class="col-md-2 d-grid">

                <label>&nbsp;</label>

                <button class="btn btn-primary" onclick="loadStudents()">
                    Load
                </button>

            </div>

        </div>


        <hr>

        <div id="studentList"></div>


        <div class="mt-3 mb-5">

            <button class="btn btn-success save-btn" onclick="saveAttendance()">
                💾 Save Attendance
            </button>

        </div>

    </div>


    <script>

        let attendanceData = [];

        const isTeacher = {{ "true" if teacher else "false" }};


        // Automatically load teacher's class/section
        document.addEventListener("DOMContentLoaded", function () {

            if (isTeacher) {

                const cls = document.getElementById("class").value;
                const sec = document.getElementById("section").value;

                if (cls && sec) {
                    loadStudents();
                }

            }

        });


        // Load Student List

        function loadStudents() {

            let cls = document.getElementById("class").value;
            let sec = document.getElementById("section").value;
            let date = document.getElementById("date").value;

            if (cls == "" || sec == "") {
                alert("Select Class and Section");
                return;
            }

            fetch(`/get_students?class=${encodeURIComponent(cls)}&section=${encodeURIComponent(sec)}`)

                .then(res => res.json())

                .then(students => {

                    attendanceData = [];

                    fetch(`/load_attendance?class=${encodeURIComponent(cls)}&section=${encodeURIComponent(sec)}&date=${encodeURIComponent(date)}`)

                        .then(res => res.json())

                        .then(old => {

                            let map = {};

                            old.forEach(item => {
                                map[item.adm_code] = item.status;
                            });

                            let html = "";

                            students.forEach((stu, index) => {

                                let photo = stu.photo
                                    ? "/static/uploads/" + stu.photo
                                    : "/static/user.png";

                                let status = map[stu.adm_code] || "P";

                                attendanceData.push({
                                    adm_code: stu.adm_code,
                                    student_name: stu.student_name,
                                    status: status
                                });

                                html += `

                        <div class="student-card">

                            <div class="row align-items-center">

                                <div class="col-2 text-center">

                                    <img src="${photo}"
                                         class="student-img">

                                </div>


                                <div class="col-4">

                                    <b>${stu.student_name}</b><br>
                                    ${stu.adm_code}

                                </div>


                                <div class="col-6">

                                    ${radio(index, "P", "Present", "success", status)}

                                    ${radio(index, "A", "Absent", "danger", status)}

                                    ${radio(index, "L", "Leave", "warning", status)}

                                    ${radio(index, "H", "Holiday", "secondary", status)}

                                </div>

                            </div>

                        </div>

                        `;

                            });

                            document.getElementById("studentList").innerHTML = html;

                        });

                });

        }


        // Radio Button HTML

        function radio(i, val, label, color, current) {

            return `
    <label class="btn btn-outline-${color} btn-sm status-btn">

        <input
            type="radio"
            name="att${i}"
            value="${val}"
            ${current == val ? "checked" : ""}
            onchange="attendanceData[${i}].status='${val}'">

        ${label}

    </label>
    `;

        }


        // Save Attendance

        function saveAttendance() {

            let payload = {

                class: document.getElementById("class").value,

                section: document.getElementById("section").value,

                date: document.getElementById("date").value,

                students: attendanceData

            };


            if (!payload.class || !payload.section) {

                alert("Class and Section are required.");

                return;

            }


            if (!payload.date) {

                alert("Date is required.");

                return;

            }


            if (!attendanceData.length) {

                alert("Please load students first.");

                return;

            }


            fetch("/save_attendance", {

                method: "POST",

                headers: {
                    "Content-Type": "application/json"
                },

                body: JSON.stringify(payload)

            })

                .then(res => res.json())

                .then(data => {

                    alert(data.message);

                })

                .catch(err => {

                    console.error(err);

                    alert("Attendance save failed.");

                });

        }

    </script>

</body>

</html>
