<!DOCTYPE html>
<html lang="en">

<head>
       <meta charset="UTF-8">
       <meta name="viewport" content="width=device-width, initial-scale=1">

       <title>Monthly Attendance Report</title>

       <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="bg-light p-3">

       <div class="container-fluid">

              <div class="card shadow-sm">

                     <div class="card-header bg-success text-white">
                            <h5 class="mb-0">📈 Monthly Attendance Report</h5>
                     </div>

                     <div class="card-body">

                            <!-- FILTERS -->
                            <div class="row g-2 mb-4">

                                   <div class="col-md-3">
                                          <label class="form-label">Month</label>
                                          <input type="month" id="month" class="form-control">
                                   </div>

                                   <div class="col-md-3">
                                          <label class="form-label">Class</label>

                                          <select id="class" class="form-select">
                                                 <option value="">Select Class</option>

                                                 {% for c in classes %}
                                                 <option value="{{ c }}">{{ c }}</option>
                                                 {% endfor %}

                                          </select>
                                   </div>

                                   <div class="col-md-3">
                                          <label class="form-label">Section</label>

                                          <select id="section" class="form-select">
                                                 <option value="">Select Section</option>

                                                 {% for s in sections %}
                                                 <option value="{{ s }}">{{ s }}</option>
                                                 {% endfor %}

                                          </select>
                                   </div>

                                   <div class="col-md-3 d-flex align-items-end">

                                          <button class="btn btn-success w-100" onclick="loadReport()">
                                                 📊 Generate Report
                                          </button>

                                   </div>

                            </div>

                            <!-- SUMMARY -->
                            <div id="summary" class="mb-3"></div>

                            <!-- REPORT TABLE -->
                            <div class="table-responsive">

                                   <table class="table table-bordered table-hover text-center">

                                          <thead class="table-dark">

                                                 <tr>
                                                        <th>#</th>
                                                        <th>Admission No.</th>
                                                        <th>Student Name</th>
                                                        <th>Present</th>
                                                        <th>Absent</th>
                                                        <th>Leave</th>
                                                        <th>Total</th>
                                                        <th>Attendance %</th>
                                                 </tr>

                                          </thead>

                                          <tbody id="reportBody">

                                                 <tr>
                                                        <td colspan="8" class="text-muted">
                                                               Select Month, Class and Section
                                                        </td>
                                                 </tr>

                                          </tbody>

                                   </table>

                            </div>

                     </div>
              </div>

       </div>


       <script>

              async function loadReport() {

                     const month = document.getElementById("month").value;
                     const cls = document.getElementById("class").value;
                     const section = document.getElementById("section").value;

                     if (!month || !cls || !section) {

                            alert("Please select Month, Class and Section");

                            return;
                     }

                     const body = document.getElementById("reportBody");

                     body.innerHTML = `
        <tr>
            <td colspan="8">Loading...</td>
        </tr>
    `;

                     try {

                            const response = await fetch(
                                   `/monthly_attendance_data?month=${encodeURIComponent(month)}&class=${encodeURIComponent(cls)}&section=${encodeURIComponent(section)}`
                            );

                            const records = await response.json();

                            if (!records.length) {

                                   body.innerHTML = `
                <tr>
                    <td colspan="8" class="text-danger">
                        No attendance data found.
                    </td>
                </tr>
            `;

                                   document.getElementById("summary").innerHTML = "";

                                   return;
                            }


                            /* GROUP STUDENTS */

                            const students = {};

                            records.forEach(r => {

                                   if (!students[r.adm_code]) {

                                          students[r.adm_code] = {

                                                 adm_code: r.adm_code,
                                                 student_name: r.student_name,

                                                 Present: 0,
                                                 Absent: 0,
                                                 Leave: 0

                                          };

                                   }

                                   const status = String(r.status || "").trim().toLowerCase();

                                   if (status === "present" || status === "p") {
                                          students[r.adm_code].Present++;
                                   }
                                   else if (status === "absent" || status === "a") {
                                          students[r.adm_code].Absent++;
                                   }
                                   else if (status === "leave" || status === "l") {
                                          students[r.adm_code].Leave++;
                                   }
                            });


                            body.innerHTML = "";

                            let index = 1;

                            Object.values(students).forEach(stu => {

                                   const present = stu.Present;
                                   const absent = stu.Absent;
                                   const leave = stu.Leave;

                                   const total = present + absent + leave;

                                   const percentage = total
                                          ? ((present / total) * 100).toFixed(1)
                                          : "0.0";


                                   body.innerHTML += `

                <tr>

                    <td>${index++}</td>

                    <td>${stu.adm_code}</td>

                    <td class="text-start">
                        ${stu.student_name}
                    </td>

                    <td>
                        <span class="badge bg-success">
                            ${present}
                        </span>
                    </td>

                    <td>
                        <span class="badge bg-danger">
                            ${absent}
                        </span>
                    </td>

                    <td>
                        <span class="badge bg-warning text-dark">
                            ${leave}
                        </span>
                    </td>

                    <td>${total}</td>

                    <td>
                        <strong>${percentage}%</strong>
                    </td>

                </tr>

            `;

                            });


                            document.getElementById("summary").innerHTML = `

            <div class="alert alert-info">

                📅 <b>Month:</b> ${month}
                &nbsp;&nbsp;|&nbsp;&nbsp;

                🏫 <b>Class:</b> ${cls}
                &nbsp;&nbsp;|&nbsp;&nbsp;

                📚 <b>Section:</b> ${section}

            </div>

        `;

                     }

                     catch (error) {

                            console.error(error);

                            body.innerHTML = `

            <tr>

                <td colspan="8"
                    class="text-danger">

                    Error loading monthly report.

                </td>

            </tr>

        `;

                     }

              }

       </script>

</body>

</html>
